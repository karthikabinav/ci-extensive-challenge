name: Issue Keyword Labeler

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-by-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || "").toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const text = `${title} ${body}`;
            const labels = [];
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description
                  });
                } else {
                  throw e;
                }
              }
            }
            if (labels.includes("bug")) await ensureLabel("bug", "d73a4a", "Bug report - contains error keyword");
            if (labels.includes("feature")) await ensureLabel("feature", "a2eeef", "Feature request - contains add keyword");
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels
              });
            }
