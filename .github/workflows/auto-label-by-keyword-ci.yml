name: Auto Label Issues by Keyword
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const text = (context.payload.issue.title + " " + (context.payload.issue.body || "")).toLowerCase();
            const labels = [];
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            if (labels.length) await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, labels});
