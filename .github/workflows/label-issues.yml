name: Label Issues
on:
  issues:
    types: [opened]
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const text = (context.payload.issue.title + " " + (context.payload.issue.body || "")).toLowerCase();
            const labels = [];
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            if (labels.length > 0) { await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: labels }); }
