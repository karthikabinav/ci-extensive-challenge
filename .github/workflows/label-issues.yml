name: Auto-Label Issues

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add bug label if issue mentions an error
        if: contains(github.event.issue.title, "error") || contains(github.event.issue.body, "error")
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: bug

      - name: Add feature label if issue mentions adding something
        if: contains(github.event.issue.title, "add") || contains(github.event.issue.body, "add")
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: feature
