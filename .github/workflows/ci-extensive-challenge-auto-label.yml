name: Auto label issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply keyword labels
        uses: actions/github-script@v7
        with:
          script: |
            const bodyPart = (context.payload.issue.body || "").toLowerCase();
            const text = `${(context.payload.issue.title || "").toLowerCase()} ${bodyPart}`;
            const labels = [];
            if (text.includes("error")) {
              labels.push("bug");
            }
            if (text.includes("add")) {
              labels.push("feature");
            }
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels
              });
            }