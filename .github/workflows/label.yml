name: Label Issues
on:
  issues:
    types: [opened]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label bug
        if: contains(github.event.issue.title, 'error') || contains(github.event.issue.body, 'error')
        run: gh issue edit ${{ github.event.issue.number }} --add-label "bug" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Label feature
        if: contains(github.event.issue.title, 'add') || contains(github.event.issue.body, 'add')
        run: gh issue edit ${{ github.event.issue.number }} --add-label "feature" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
