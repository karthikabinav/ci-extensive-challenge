name: Auto Label Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label new issues by keyword
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = [issue.title || '', issue.body || ''].join('\n').toLowerCase();
            const rules = [
              { keyword: 'error', label: 'bug', color: 'd73a4a', description: 'Something is not working' },
              { keyword: 'add', label: 'feature', color: 'a2eeef', description: 'New feature or request' }
            ];
            const matches = rules.filter(rule => text.includes(rule.keyword));
            if (matches.length === 0) return;

            for (const rule of matches) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: rule.label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name: rule.label,
                    color: rule.color,
                    description: rule.description
                  });
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  // Another workflow may have created the label concurrently.
                  await github.rest.issues.getLabel({ ...context.repo, name: rule.label });
                }
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: matches.map(rule => rule.label)
            });
