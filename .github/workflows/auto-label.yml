name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add labels matching issue keywords
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const text = [(issue.title || ""), (issue.body || "")].join("\n").toLowerCase();
            const labels = [];
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            if (labels.length === 0) return;
            const definitions = {
              bug: { color: "d73a4a", description: "Something is not working" },
              feature: { color: "a2eeef", description: "New functionality" }
            };
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, ...definitions[name] }).catch(()=>{});
                }
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
