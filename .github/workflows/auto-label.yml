name: Auto Label Issues
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const text = title + " " + body;
            const labelsToAdd = [];
            if (text.includes("error")) labelsToAdd.push("bug");
            if (text.includes("add")) labelsToAdd.push("feature");
            if (labelsToAdd.length === 0) return;
            // Ensure labels exist
            for (const name of labelsToAdd) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: name === "bug" ? "d73a4a" : "a2eeef",
                    description: name === "bug" ? "Something is not working" : "New feature request"
                  });
                } else { throw e; }
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: labelsToAdd
            });
