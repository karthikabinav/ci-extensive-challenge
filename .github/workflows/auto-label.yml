name: Auto Label Issues

on:
  issues:
    types: [opened, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto label by keyword
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const text = title + " " + body;
            const labels = [];
            if (text.includes('error')) labels.push('bug');
            if (text.includes('add')) labels.push('feature');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
              console.log(`Added labels ${labels.join(',')} to issue #${context.payload.issue.number}`);
            } else {
              console.log('No matching keywords found for auto-labeling');
            }
