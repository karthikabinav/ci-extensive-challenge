name: Auto Label Issues
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Secure auto-label by keyword (word boundaries)
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const body = context.payload.issue.body || "";
            const text = `${title} ${body}`;
            const labels = [];
            // Use word boundaries to avoid false positives (e.g., "adding" should not match "add")
            if (/\berror\b/i.test(text)) labels.push("bug");
            if (/\badd\b/i.test(text)) labels.push("feature");
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }
