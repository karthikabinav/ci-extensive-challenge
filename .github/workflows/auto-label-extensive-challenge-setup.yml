name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label bug if contains error
        if: contains(github.event.issue.title, 'error') || contains(github.event.issue.body, 'error')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["bug"]
            })
      - name: Label feature if contains add
        if: contains(github.event.issue.title, 'add') || contains(github.event.issue.body, 'add')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["feature"]
            })
