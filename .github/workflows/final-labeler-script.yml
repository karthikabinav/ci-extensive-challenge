name: Student Auto Label Script

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Label issues by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const content = (context.payload.issue.title + " " + (context.payload.issue.body || "")).toLowerCase();
            const labels = [];
            if (content.includes("error")) labels.push("bug");
            if (content.includes("add")) labels.push("feature");
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }
