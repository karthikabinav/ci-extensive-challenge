name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label issue based on keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const text = `${title} ${body}`;
            
            let labels = [];
            
            if (text.includes("error")) {
              labels.push("bug");
            }
            
            if (text.includes("add")) {
              labels.push("feature");
            }
            
            if (labels.length > 0) {
              const existingLabels = context.payload.issue.labels.map(l => typeof l === "string" ? l : l.name);
              labels = labels.filter(l => !existingLabels.includes(l));
              
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: labels
                });
                console.log(`Added labels: ${labels.join(", ")}`);
              }
            } else {
              console.log("No matching keywords found for labeling");
            }