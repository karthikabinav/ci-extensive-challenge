name: Auto-label issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to label or retry
        required: true
        type: string

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue = context.payload.issue;
            if (context.eventName === "workflow_dispatch") {
              const value = context.payload.inputs.issue_number || "";
              const number = Number(value);
              if (!/^[1-9][0-9]*$/.test(value) || !Number.isSafeInteger(number)) {
                throw new Error("A positive integer issue number is required.");
              }
              issue = (await github.rest.issues.get({...context.repo, issue_number: number})).data;
            }
            if (!issue || issue.pull_request) { throw new Error("Only repository issues are supported."); }
            const text = [issue.title || "", issue.body || ""].join("\n").toLowerCase();
            const rules = [
              { keyword: "error", name: "bug" },
              { keyword: "add", name: "feature" }
            ];
            const matches = rules.filter(rule => text.includes(rule.keyword));
            if (matches.length === 0) { core.info("No matching keywords."); return; }
            await github.rest.issues.addLabels({...context.repo, issue_number: issue.number, labels: matches.map(l => l.name)});
            core.info("Labeled issue #" + issue.number + ": " + matches.map(l => l.name).join(", "));
