name: Auto-label issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read issue text as data, never as executable code or shell input.
            const issue = context.payload.issue;
            const text = [issue.title || "", issue.body || ""].join("\n").toLowerCase();
            const rules = [
              { keyword: "error", name: "bug", color: "d73a4a", description: "Something is not working" },
              { keyword: "add", name: "feature", color: "a2eeef", description: "New functionality" }
            ];
            // Substring matches intentionally include words such as adding.
            // Independent rules allow an issue to receive both labels.
            const matches = rules.filter(rule => text.includes(rule.keyword));
            if (matches.length === 0) {
              core.info("No matching keywords.");
              return;
            }

            for (const label of matches) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } catch (createError) {
                  // Another issue run may have created the same label concurrently.
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                }
              }
            }

            // Add matching labels without removing existing labels.
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: matches.map(label => label.name)
            });
