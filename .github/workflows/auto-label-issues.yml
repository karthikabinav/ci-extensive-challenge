name: Auto Label Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to label for manual testing
        required: true
        type: string

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            let issue = context.payload.issue;
            if (context.eventName === "workflow_dispatch") {
              const issueNumber = Number(process.env.ISSUE_NUMBER);
              if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
                throw new Error("issue_number must be a positive integer");
              }
              const response = await github.rest.issues.get({
                ...context.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            }
            if (!issue || issue.pull_request) return;
            const text = [issue.title || "", issue.body || ""].join("\n").toLowerCase();
            const rules = [
              { keyword: "error", label: "bug", color: "d73a4a", description: "Something is not working" },
              { keyword: "add", label: "feature", color: "a2eeef", description: "New feature or request" }
            ];
            const matches = rules.filter(rule => text.includes(rule.keyword));
            if (matches.length === 0) return;

            for (const rule of matches) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: rule.label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name: rule.label,
                    color: rule.color,
                    description: rule.description
                  });
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  // Confirm another run created the label before continuing.
                  await github.rest.issues.getLabel({ ...context.repo, name: rule.label });
                }
              }
            }
            const labels = matches.map(rule => rule.label);
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels
            });
            core.info(`Applied ${labels.join(", ")} to issue #${issue.number}`);
