name: Auto Label Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to label for manual testing
        required: true
        type: string

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            let issue = context.payload.issue;
            if (context.eventName === "workflow_dispatch") {
              const issueNumber = Number(process.env.ISSUE_NUMBER);
              if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
                throw new Error("issue_number must be a positive integer");
              }
              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            }
            if (!issue || issue.pull_request) return;
            const text = ((issue.title || "") + "\n" + (issue.body || "")).toLowerCase();
            const labels = [];
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            if (labels.length === 0) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels
            });
