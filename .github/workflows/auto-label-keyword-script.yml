name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (value) => (value || "").toLowerCase();
            const title = normalize(context.payload.issue.title);
            const body = normalize(context.payload.issue.body);
            const text = `${title} ${body}`;
            const labels = [];
            if (text.includes("error")) {
              labels.push("bug");
            }
            if (text.includes("add")) {
              labels.push("feature");
            }
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
