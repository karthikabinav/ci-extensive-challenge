name: Auto Label Issues by Keyword
on:
  issues:
    types: [opened]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const content = (context.payload.issue.title + " " + (context.payload.issue.body || "")).toLowerCase();
            const labels = [];
            if (content.includes("error")) labels.push("bug");
            if (content.includes("add")) labels.push("feature");
            if (labels.length) await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, labels});
