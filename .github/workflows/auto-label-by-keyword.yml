name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to label
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: keyword-label-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add labels matching issue keywords
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let issue = context.payload.issue;
            if (context.eventName === "workflow_dispatch") {
              const issue_number = Number(context.payload.inputs.issue_number);
              if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
                throw new Error("issue_number must be a positive integer");
              }
              issue = (await github.rest.issues.get({ owner, repo, issue_number })).data;
            }
            if (!issue || issue.pull_request) {
              throw new Error("This workflow labels issues only");
            }
            // Issue titles and bodies are data, never executable code.
            const text = `${issue.title || ""}\n${issue.body || ""}`.toLowerCase();
            const labels = [];
            // Match substrings: "adding" contains "add". Apply both labels when both match.
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            if (labels.length === 0) {
              core.info(`Issue #${issue.number}: no matching keywords`);
              return;
            }

            const definitions = {
              bug: { color: "d73a4a", description: "Something is not working" },
              feature: { color: "a2eeef", description: "New functionality or enhancement" }
            };
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, ...definitions[name] });
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  // Another issue event may have created the label concurrently.
                  await github.rest.issues.getLabel({ owner, repo, name });
                }
              }
            }
            // Preserve existing labels; only add the matching ones.
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
            core.info(`Issue #${issue.number}: applied ${labels.join(", ")}`);
