name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = ((issue.title || '') + ' ' + (issue.body || '')).toLowerCase();
            const labels = [];
            if (text.includes('error')) labels.push('bug');
            if (text.includes('add')) labels.push('feature');
            for (const name of labels) {
              try { await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name: name}); } catch (e) { if (e.status === 404) { try { await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name: name}); } catch (ignored) {} } }
            }
            if (labels.length > 0) {
              await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: labels});
            }
