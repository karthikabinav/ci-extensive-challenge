name: Auto Label Issues by Keyword

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply keyword labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Treat issue text as data, never as executable code.
            const issue = context.payload.issue;
            const text = [issue.title || "", issue.body || ""].join("\n").toLowerCase();
            const rules = [
              { keyword: "error", name: "bug", color: "d73a4a", description: "Something is not working" },
              { keyword: "add", name: "feature", color: "a2eeef", description: "New feature or request" }
            ];
            // Substring matching includes words such as adding; both labels can apply.
            const matches = rules.filter(rule => text.includes(rule.keyword));
            for (const { name, color, description } of matches) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ ...context.repo, name, color, description });
                } catch (createError) {
                  // Another issue run may have created this label concurrently.
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ ...context.repo, name });
                }
              }
            }
            if (matches.length > 0) {
              // Append labels without removing any existing labels.
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: matches.map(rule => rule.name)
              });
            }
