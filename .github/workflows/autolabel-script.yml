name: Autolabel Script

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label issue by keyword
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || "").toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const text = `${title} ${body}`;
            const labels = [];
            if (text.includes("error")) labels.push("bug");
            if (text.includes("add")) labels.push("feature");
            if (labels.length > 0) {
              // Ensure labels exist before adding
              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name: label});
                } catch (e) {
                  if (e.status === 404) {
                    await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name: label, color: label === "bug" ? "d73a4a" : "a2eeef", description: label});
                  }
                }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels
              });
            }
